name: Build und Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt pyinstaller

      - name: macOS App bauen
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "Finanzuebersicht" \
            --osx-bundle-identifier "com.jan.finanzuebersicht" \
            "finanzübersicht.py"

      - name: App als ZIP verpacken
        run: |
          cd dist
          zip -r Finanzuebersicht-macOS.zip "Finanzuebersicht.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/Finanzuebersicht-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt pyinstaller

      - name: Windows EXE bauen
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "Finanzuebersicht" `
            "finanzübersicht.py"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/Finanzuebersicht.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-build

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Finanzuebersicht ${{ github.ref_name }}"
          body: |
            ## Download

            | System | Datei | Anleitung |
            |---|---|---|
            | macOS | `Finanzuebersicht-macOS.zip` | Entpacken → Rechtsklick auf App → Öffnen |
            | Windows | `Finanzuebersicht.exe` | Direkt starten |

            > **macOS Hinweis:** Beim ersten Start erscheint eine Sicherheitswarnung.
            > Rechtsklick auf die App → „Öffnen" → „Öffnen" bestätigen. Danach startet sie normal.
          files: |
            Finanzuebersicht-macOS.zip
            Finanzuebersicht.exe
